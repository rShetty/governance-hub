[package]
name = "governance-hub"
version = "0.1.0"
edition = "2021"
description = "Unified AI governance dashboard across Hive, Patroclus, Relay, Miser, Sentiel and Aegis"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "cors"] }
include_dir = "0.7"
mime_guess = "2"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
toml = "0.8"
urlencoding = "2"

[dev-dependencies]
http-body-util = "0.1"
