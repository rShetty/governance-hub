name: Deploy Governance Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-hub-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build React UI
        working-directory: frontend
        run: |
          npm install --no-fund --no-audit
          npm run build
      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain (linux target)
        run: |
          rustup update stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Build React UI
        working-directory: frontend
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Build release binary (UI embedded)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package delivery bundle
        run: |
          mkdir -p bundle
          cp target/x86_64-unknown-linux-gnu/release/governance-hub bundle/
          cp hub.toml bundle/
          cp deploy/governance-hub.service bundle/
          tar -czf governance-hub-bundle.tar.gz -C bundle .

      - name: Connect to tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:hostinger

      - name: Ship bundle to VPS (with retries)
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: governance-hub-bundle.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 10m
          retries: 3

      - name: Install, restart service, health-gate (with retries)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          retries: 3
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /etc/governance-hub /var/lib/governance-hub
            id govhub >/dev/null 2>&1 || useradd --system --home-dir /var/lib/governance-hub --create-home --shell /usr/sbin/nologin govhub
            tar -xzf /tmp/governance-hub-bundle.tar.gz -C /tmp/gh-bundle-extract 2>/dev/null || {
              mkdir -p /tmp/gh-bundle-extract
              tar -xzf /tmp/governance-hub-bundle.tar.gz -C /tmp/gh-bundle-extract
            }
            install -m 755 /tmp/gh-bundle-extract/governance-hub /usr/local/bin/governance-hub
            install -m 644 /tmp/gh-bundle-extract/hub.toml /etc/governance-hub/hub.toml
            install -m 644 /tmp/gh-bundle-extract/governance-hub.service /etc/systemd/system/governance-hub.service
            if [ ! -s /etc/governance-hub/env ]; then
              echo "HUB_ADMIN_TOKEN=$(openssl rand -hex 32)" > /etc/governance-hub/env
              chmod 600 /etc/governance-hub/env
            fi
            chown -R govhub:govhub /var/lib/governance-hub
            systemctl daemon-reload
            systemctl enable governance-hub
            systemctl restart governance-hub
            rm -rf /tmp/gh-bundle-extract /tmp/governance-hub-bundle.tar.gz
            sleep 3
            curl -sf http://127.0.0.1:8600/health && echo "HEALTH OK"
