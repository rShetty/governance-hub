name: Deploy Governance Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-hub-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build release binary (linux/amd64)
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governance-hub-bin
          path: target/x86_64-unknown-linux-gnu/release/governance-hub

      - name: Ship binary + config to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/x86_64-unknown-linux-gnu/release/governance-hub,hub.toml,deploy/governance-hub.service"
          target: /tmp/governance-hub-delivery
          strip_components: 1

      - name: Install, provision user, restart service
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            install -m 755 /tmp/governance-hub-delivery/governance-hub /usr/local/bin/governance-hub
            id govhub >/dev/null 2>&1 || useradd --system --home-dir /var/lib/governance-hub --create-home --shell /usr/sbin/nologin govhub
            mkdir -p /etc/governance-hub /var/lib/governance-hub
            install -m 644 /tmp/governance-hub-delivery/hub.toml /etc/governance-hub/hub.toml
            install -m 644 /tmp/governance-hub-delivery/governance-hub.service /etc/systemd/system/governance-hub.service
            chown -R govhub:govhub /var/lib/governance-hub
            systemctl daemon-reload
            systemctl enable governance-hub
            systemctl restart governance-hub
            rm -rf /tmp/governance-hub-delivery
            sleep 3
            curl -sf http://127.0.0.1:8600/health && echo "HEALTH OK"

      - name: Health verification
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            curl -sf http://127.0.0.1:8600/health || { journalctl -u governance-hub -n 30 --no-pager; exit 1; }
